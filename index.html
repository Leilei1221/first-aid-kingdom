<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>急救王國：綠葉谷</title>
<meta name="theme-color" content="#0F1720">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="急救王國">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1720;--panel:rgba(16,24,33,.93);--panel2:rgba(38,52,66,.95);--gold:#E3B95B;--gold-dim:rgba(227,185,91,.45);--text:#F5EFE2;--muted:#B8C2C9;
  --ok:#86E0A4;--bad:#FF9A9A;--warn:#FFD68A;--red:#D9463B;
  --sans:"Noto Sans TC","PingFang TC","Heiti TC","Microsoft JhengHei",sans-serif;--serif:"Noto Serif TC","Songti TC","PMingLiU",serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#0F1720}}
:root[data-theme="dark"]{--ink:#0F1720}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--ink);scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);overflow:hidden;-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{position:relative;height:100%;overflow:hidden}
#title .bg{position:absolute;inset:0;background:var(--world) center/cover no-repeat}
#title .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,16,22,.9) 0%,rgba(10,16,22,.55) 48%,rgba(10,16,22,.1) 78%)}
#title .hero-art{position:absolute;right:4%;bottom:0;height:92%;max-width:46%;object-fit:contain;object-position:bottom;filter:drop-shadow(0 12px 30px rgba(0,0,0,.5))}
#title .copy{position:absolute;left:7%;top:50%;transform:translateY(-50%);max-width:min(560px,54%)}
#title h1{font-family:var(--serif);font-weight:900;font-size:clamp(44px,8vw,92px);line-height:1.05;margin:0;color:#FFF6E0;letter-spacing:.06em;text-shadow:0 3px 0 rgba(0,0,0,.35),0 10px 30px rgba(0,0,0,.5)}
#title .sub{font-family:var(--serif);font-size:clamp(18px,2.4vw,24px);color:var(--gold);margin:10px 0 0}
#title p{font-size:clamp(15px,1.9vw,19px);line-height:1.85;color:#E9E1CF;margin:18px 0 30px}
.cta{min-height:54px;padding:0 34px;border-radius:999px;border:2px solid #F3D48A;background:var(--gold);color:#2A1D08;font-weight:900;font-size:19px;cursor:pointer;box-shadow:0 6px 0 #9A7424,0 12px 24px rgba(0,0,0,.35)}
.cta:active{transform:translateY(3px);box-shadow:0 3px 0 #9A7424}

#game{background:#000}
#view{position:absolute;inset:0;overflow:hidden}
#plane{position:absolute;left:0;top:0;width:1672px;height:941px;transform-origin:0 0;background-size:100% 100%;will-change:transform}
.ent{position:absolute;left:0;top:0;pointer-events:none}
.spr{transform:translate(calc(var(--x)*1px - var(--w)*.5px),calc(var(--y)*1px - var(--h)*1px));width:calc(var(--w)*1px);height:calc(var(--h)*1px)}
.spr img{width:100%;height:100%;object-fit:contain;object-position:bottom;display:block}
.spr.shadow::before{content:"";position:absolute;left:22%;right:22%;bottom:-3%;height:9%;border-radius:50%;background:rgba(0,0,0,.35);z-index:-1}
#hero.spr.shadow::before{box-shadow:0 0 0 3px rgba(227,185,91,.85)}
#hero img.flip,.npc img.flip{transform:scaleX(-1)}
#hero.walking img{animation:bob .3s ease-in-out infinite alternate}
#hero.walking img.flip{animation-name:bobf}
@keyframes bob{to{transform:translateY(-4%)}}@keyframes bobf{from{transform:scaleX(-1)}to{transform:scaleX(-1) translateY(-4%)}}
.tag{position:absolute;left:50%;bottom:100%;transform:translateX(-50%);margin-bottom:6px;white-space:nowrap;font-weight:900;font-size:22px;padding:2px 12px;border-radius:8px;background:rgba(16,24,33,.82);color:#FFF3D6}
.tag .bang{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--red);color:#fff;margin-left:6px;font-size:16px;vertical-align:1px}
.tree.hit img{animation:shake .25s}
.signpost{z-index:950;white-space:nowrap;font-weight:900;font-size:24px;padding:4px 14px;border-radius:10px;background:rgba(16,24,33,.78);color:#FFE9A8;border:2px solid rgba(227,185,91,.7)}
#game.quake #plane{animation:quakeA .85s}
@keyframes quakeA{10%,50%,90%{margin-left:-12px;margin-top:4px}30%,70%{margin-left:12px;margin-top:-4px}100%{margin-left:0;margin-top:0}}
@keyframes shake{25%{transform:translateX(-3%)}75%{transform:translateX(3%)}}
.ring{width:calc(var(--r)*2px);height:calc(var(--r)*.9px);border-radius:50%;border:4px solid rgba(255,243,214,.95);transform:translate(calc(var(--x)*1px - var(--r)*1px),calc(var(--y)*1px - var(--r)*.45px));opacity:0;transition:opacity .15s}
.ring.on{opacity:1}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .28s;z-index:30}
#fade.on{opacity:1}

.hud{position:absolute;left:12px;right:12px;top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:10}
.pill{min-height:44px;display:inline-flex;align-items:center;gap:8px;padding:0 15px;border-radius:999px;background:var(--panel);border:1.5px solid var(--gold-dim);font-weight:700;font-size:15px}
button.pill{cursor:pointer}
.pill b{color:var(--gold)}
.sta{display:inline-block;width:70px;height:10px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}.sta i{display:block;height:100%;background:var(--ok);transition:width .2s}.sta i.low{background:var(--bad)}
.ghost{opacity:.55;filter:grayscale(.5)}
.drop{position:absolute;left:50%;top:6%;transform:translateX(-50%);width:34px;height:34px;border-radius:50%;background:#4F8FD6;color:#fff;font-size:18px;display:grid;place-items:center;border:3px solid #fff}
.seeds{position:absolute;left:50%;top:42%;transform:translateX(-50%);font-size:22px;font-weight:900;padding:2px 10px;border-radius:8px;background:rgba(16,24,33,.8);color:#FFF3D6;white-space:nowrap}
.place{font-family:var(--serif);font-weight:900;font-size:19px;color:#FFF3D6;margin-right:auto}
#goal{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:9;width:max-content;max-width:min(560px,calc(100% - 420px));padding:8px 14px;border-radius:12px;background:var(--panel);border:1.5px solid var(--gold-dim);font-size:15px;line-height:1.6}
#goal b{color:var(--gold);margin-right:6px}
#toast{position:fixed;left:50%;top:120px;transform:translateX(-50%);z-index:60;padding:8px 18px;border-radius:999px;background:var(--panel);border:1.5px solid var(--gold);font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
.ctrl{position:absolute;z-index:12;bottom:calc(18px + env(safe-area-inset-bottom,0px));touch-action:none}
#joy{left:22px;width:170px;height:170px;border-radius:50%;background:rgba(16,24,33,.55);border:2px solid var(--gold-dim)}
#joy .knob{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;background:rgba(227,185,91,.9);border:3px solid #FFF3D6;box-shadow:0 4px 12px rgba(0,0,0,.4);transform:translate(var(--kx,0px),var(--ky,0px))}
#dpad{left:22px;width:180px;height:180px;display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px)}
#dpad button{border-radius:14px;background:rgba(16,24,33,.72);border:2px solid var(--gold-dim);display:grid;place-items:center;cursor:pointer;touch-action:none}
#dpad button.on{background:rgba(227,185,91,.85)}
#dpad svg{width:28px;height:28px}
#act{right:26px;width:128px;height:128px;border-radius:50%;background:rgba(16,24,33,.6);border:3px solid var(--gold-dim);display:grid;place-items:center;text-align:center;font-weight:900;font-size:19px;line-height:1.25;color:rgba(245,239,226,.45);cursor:pointer;padding:10px}
#act.ready{background:var(--gold);border-color:#FFF3D6;color:#2A1D08;box-shadow:0 6px 0 #9A7424,0 10px 20px rgba(0,0,0,.35)}
#act.ready:active{transform:translateY(3px);box-shadow:0 3px 0 #9A7424}

.badge{--s:40px;width:var(--s);height:var(--s);flex:none;border-radius:50%;display:inline-grid;place-items:center;background:var(--c);color:var(--tc);font-weight:900;font-size:calc(var(--s)*.4);line-height:1;border:3px solid var(--gold);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.badge.lg{--s:72px}
#dialog{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(180deg,rgba(8,12,16,0) 25%,rgba(8,12,16,.6));padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px))}
.box{width:min(780px,100%);max-height:86%;overflow:auto;display:flex;gap:16px;background:rgba(16,24,33,.98);border:2px solid var(--gold);border-radius:18px;padding:18px 20px;box-shadow:0 0 0 5px rgba(16,24,33,.6),0 18px 40px rgba(0,0,0,.5);animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
.face{flex:none;width:84px;height:84px;border-radius:50%;border:3px solid var(--gold);background:#F4E7CC center/cover no-repeat;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:34px;color:#6B3F16}
.body{flex:1;min-width:0}
.who{font-family:var(--serif);font-weight:900;font-size:20px;color:var(--gold);margin:2px 0 4px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.hearts{font-family:var(--sans);font-size:15px;color:#FF8FA3;letter-spacing:.1em}
#dText{font-size:17px;line-height:1.8}
#dText p{margin:.3em 0}
#dText h3{margin:0 0 4px;font-size:21px;font-weight:900}
#dText h4{margin:12px 0 6px;font-size:16px;color:var(--gold)}
.q{font-weight:900;font-size:19px}
.good{color:var(--ok);font-weight:900}.bad{color:var(--bad);font-weight:900}.warn{color:var(--warn)}
.small{font-size:14px;color:var(--muted)}
.found{display:flex;gap:16px;align-items:center}
.btns{display:grid;gap:8px;margin-top:14px}
.btn{min-height:50px;font-size:16px;font-weight:700;background:var(--panel2);border:1.5px solid var(--gold-dim);border-radius:12px;padding:10px 16px;text-align:left;cursor:pointer;line-height:1.5}
.btn.primary{background:var(--gold);color:#2A1D08;border-color:var(--gold);text-align:center;font-weight:900}
.btn.danger{border-color:var(--red);color:#FFB8B0;text-align:center}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.row .info{flex:1;min-width:0}
.row .info b{display:block}
.row .info span{font-size:14px;color:var(--muted)}
.row button{min-height:44px;padding:0 16px;border-radius:10px;border:1.5px solid var(--gold);background:var(--gold);color:#2A1D08;font-weight:900;cursor:pointer;white-space:nowrap}
.row button:disabled{background:transparent;color:var(--muted);border-color:rgba(255,255,255,.2);cursor:not-allowed}
.meter{height:10px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0 2px}
.meter i{display:block;height:100%;background:var(--ok)}
.meter i.heavy{background:var(--warn)}.meter i.over{background:var(--bad)}
.card{background:var(--panel2);border:1.5px solid var(--gold-dim);border-radius:14px;padding:12px 16px;margin:8px 0}
.card b{color:var(--gold)}
@media (max-width:640px){.box{flex-direction:column;gap:8px}.face{width:60px;height:60px}#title .hero-art{opacity:.35;max-width:80%}#title .copy{max-width:86%}#goal{bottom:auto;top:118px;max-width:calc(100% - 24px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.authbox{margin-top:18px;font-size:14px;line-height:1.7;color:#E9E1CF;min-height:24px}.authbox .small{opacity:.8}
.authbox button{min-height:40px;padding:0 18px;border-radius:999px;border:2px solid var(--gold-dim);background:rgba(16,24,33,.6);color:var(--text);font-weight:700;font-size:15px;cursor:pointer;margin:4px 8px 4px 0}
/* ===== 手機橫向 ===== */
#rotate{display:none;position:fixed;inset:0;z-index:100;background:rgba(10,16,22,.96);color:#FFF3D6;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;font-weight:900;font-size:20px}
#rotate .ph{width:70px;height:120px;border:5px solid var(--gold);border-radius:14px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
#rotate small{font-weight:500;font-size:14px;color:var(--muted)}
#btnFull{display:none}
@media (orientation:portrait) and (max-width:700px){ body.playing #rotate{display:flex} }
@media (max-height:520px) and (orientation:landscape){
  .hud{top:max(6px,env(safe-area-inset-top,0px));left:calc(8px + env(safe-area-inset-left,0px));right:calc(8px + env(safe-area-inset-right,0px));gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .hud::-webkit-scrollbar{display:none}
  .pill{min-height:32px;padding:0 10px;font-size:12px;gap:5px;flex:none}
  .place{font-size:13px}
  .sta{width:44px;height:8px}
  #goal{font-size:12px;padding:5px 10px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 300px);line-height:1.4}
  #toast{top:48px;font-size:13px;padding:6px 14px}
  .ctrl{bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  #joy{left:calc(12px + env(safe-area-inset-left,0px));width:112px;height:112px}
  #joy .knob{width:50px;height:50px;margin:-25px 0 0 -25px}
  #dpad{left:calc(12px + env(safe-area-inset-left,0px));width:126px;height:126px;grid-template-columns:repeat(3,42px);grid-template-rows:repeat(3,42px)}
  #dpad svg{width:20px;height:20px}
  #act{right:calc(14px + env(safe-area-inset-right,0px));width:86px;height:86px;font-size:14px;padding:6px}
  #dialog{padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
  .box{max-height:96%;padding:10px 14px;gap:10px;border-radius:14px}
  .face{width:48px;height:48px;font-size:22px;border-width:2px}
  .who{font-size:15px;margin:0 0 2px}
  #dText{font-size:14px;line-height:1.6}
  #dText h3{font-size:16px}#dText h4{font-size:14px;margin:8px 0 4px}
  .q{font-size:15px}
  .btns{gap:5px;margin-top:8px}
  .btn{min-height:38px;font-size:13px;padding:6px 12px}
  .row{padding:6px 0;gap:8px}.row button{min-height:34px;padding:0 10px;font-size:12px}
  .badge{--s:30px}.badge.lg{--s:52px}
  .card{padding:8px 12px;margin:6px 0}
  #title h1{font-size:44px}#title p{font-size:14px;margin:10px 0 16px;line-height:1.6}#title .sub{font-size:16px}
  .cta{min-height:44px;font-size:16px;padding:0 24px}
  #btnFull{display:inline-flex}
}

@media (max-height:520px) and (orientation:landscape){
  .box{flex-direction:row!important;gap:10px}
  .face{width:44px!important;height:44px!important}
  #title .hero-art{opacity:1;max-width:40%}#title .copy{max-width:56%}
}
@media (max-height:320px) and (orientation:landscape){
  .hud{top:4px}.pill{min-height:26px;font-size:11px;padding:0 8px}.place{font-size:11px}.sta{width:32px}
  #goal{display:none}
  #joy{width:88px;height:88px}#joy .knob{width:40px;height:40px;margin:-20px 0 0 -20px}
  #dpad{width:102px;height:102px;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px)}
  #act{width:70px;height:70px;font-size:12px}
  .box{padding:8px 10px;max-height:98%}.face{width:34px!important;height:34px!important;font-size:16px}
  .who{font-size:13px}#dText{font-size:12.5px;line-height:1.5}.q{font-size:13px}
  .btn{min-height:30px;font-size:12px;padding:4px 10px}.btns{margin-top:6px;gap:4px}
  #title h1{font-size:30px}#title p{display:none}#title .sub{font-size:13px;margin-bottom:10px}.cta{min-height:36px;font-size:14px}
}
</style>
</head>
<body>
<section class="screen" id="title">
  <div class="bg"></div><div class="shade"></div>
  <img class="hero-art" alt="" id="titleHero">
  <div class="copy">
    <h1>急救王國</h1>
    <div class="sub">序章　綠葉谷</div>
    <p>百年前守護王國的救護騎士團早已解散，神器也散落各地。如今災厄之霧再次出現，而你，是最後一任騎士團團長的孫子。</p>
    <button class="cta" id="btnStart" type="button">開始冒險</button>
    <div class="authbox" id="authBox" aria-live="polite"></div>
  </div>
</section>

<section class="screen" id="game" hidden>
  <div id="view"><div id="plane"></div></div>
  <div class="hud">
    <span class="pill place" id="place">綠葉谷</span>
    <span class="pill">第 <b id="day">1</b> 天</span>
    <span class="pill" aria-label="體力">體力 <span class="sta"><i id="staBar"></i></span> <b id="sta">100</b></span>
    <span class="pill">金幣 <b id="coins">0</b></span>
    <button class="pill" id="btnBag" type="button">背包 <b id="bagInfo">0/4</b></button>
    <button class="pill" id="btnCards" type="button">知識卡 <b id="cardInfo">0</b></button>
    <button class="pill" id="btnSettings" type="button">設定</button>
    <button class="pill" id="btnFull" type="button">全螢幕</button>
  </div>
  <div id="goal"></div>
  <div id="toast"></div>
  <div class="ctrl" id="joy" aria-label="移動搖桿"><div class="knob"></div></div>
  <div class="ctrl" id="dpad" hidden>
    <span></span><button type="button" data-d="up" aria-label="上"><svg viewBox="0 0 24 24" fill="none" stroke="#FFF3D6" stroke-width="3" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg></button><span></span>
    <button type="button" data-d="left" aria-label="左"><svg viewBox="0 0 24 24" fill="none" stroke="#FFF3D6" stroke-width="3" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><span></span><button type="button" data-d="right" aria-label="右"><svg viewBox="0 0 24 24" fill="none" stroke="#FFF3D6" stroke-width="3" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
    <span></span><button type="button" data-d="down" aria-label="下"><svg viewBox="0 0 24 24" fill="none" stroke="#FFF3D6" stroke-width="3" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg></button><span></span>
  </div>
  <button class="ctrl" id="act" type="button" aria-label="動作">動作</button>
  <div id="fade"></div>
  <div id="rotate"><div class="ph"></div>請把手機轉成橫向<small>橫著玩，畫面和操作都比較舒服</small></div>
</section>

<div id="dialog" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="dWho">
    <div class="face" id="dFace"></div>
    <div class="body"><div class="who" id="dWho"></div><div id="dText"></div><div class="btns" id="dBtns"></div></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/cloud.js"></script>
<script src="js/music.js"></script>
<script src="js/game.js"></script>
</body>
</html>
